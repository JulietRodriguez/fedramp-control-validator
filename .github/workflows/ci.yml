name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest --cov=fedramp_control_validator --cov-report=term-missing

      - name: Smoke-test the CLI
        run: |
          fedramp-control-validator examples/aws_config_findings.json \
            --no-banner -o assessment-results.json -g gap-analysis.json
          python -c "import json; d=json.load(open('assessment-results.json')); assert d['assessment-results']['metadata']['oscal-version'] == '1.1.2', 'bad oscal version'"

      - name: Enforce score gate on the clean reference environment
        run: |
          fedramp-control-validator examples/aws_config_findings_clean.json \
            --no-banner --fail-under 100

  validate-examples:
    name: Validate example JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure every example parses as JSON
        run: |
          for f in examples/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1])); print('ok', sys.argv[1])" "$f"
          done

  oscal-schema:
    name: Validate OSCAL output against NIST schema
    runs-on: ubuntu-latest
    env:
      # NIST OSCAL v1.1.2 Assessment Results schema, pinned by SHA-256.
      OSCAL_SCHEMA_URL: https://github.com/usnistgov/OSCAL/releases/download/v1.1.2/oscal_assessment-results_schema.json
      OSCAL_SCHEMA_SHA256: d033da70154cf6625ae46a746199e88e58f2928b1387dfac051d381b92f41b0d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Download schema
        run: |
          mkdir -p schemas
          curl -sSfL "$OSCAL_SCHEMA_URL" -o schemas/oscal_assessment-results_schema.json
          echo "$OSCAL_SCHEMA_SHA256  schemas/oscal_assessment-results_schema.json" | sha256sum -c -
      - name: Validate every example's OSCAL output
        run: |
          for f in examples/*.json; do
            out="/tmp/ar_$(basename "$f")"
            fedramp-control-validator "$f" --no-banner -o "$out" > /dev/null
            python tools/validate_oscal.py --schema schemas/oscal_assessment-results_schema.json "$out"
          done
